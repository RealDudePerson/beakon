{% extends "layout.html" %}
{% block title %}Speed{% endblock %}
{% block top_menu_buttons %}
{% endblock %}
{% block content %}
<div class="speed-page">
    <div class="speedometer-container">
        <svg viewBox="0 0 200 120" class="speedometer-svg">
            <defs>
                <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:0.7" />
                </linearGradient>
                <linearGradient id="yellowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#FFC107;stop-opacity:0.7" />
                    <stop offset="100%" style="stop-color:#FFC107;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#F44336;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#F44336;stop-opacity:1" />
                </linearGradient>
            </defs>
            
            <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#333" stroke-width="2"/>
            
            <path d="M 20 100 A 80 80 0 0 1 57 34" fill="none" stroke="#4CAF50" stroke-width="12" stroke-linecap="round"/>
            <path d="M 57 34 A 80 80 0 0 1 100 20" fill="none" stroke="#FFC107" stroke-width="12" stroke-linecap="round"/>
            <path d="M 100 20 A 80 80 0 0 1 180 100" fill="none" stroke="#F44336" stroke-width="12" stroke-linecap="round"/>
            
            <text x="25" y="95" class="speed-label">0</text>
            <text x="93" y="18" class="speed-label">20</text>
            <text x="170" y="95" class="speed-label">40</text>
            
            <g id="needle-group">
                <line id="needle" x1="100" y1="100" x2="100" y2="35" stroke="#222" stroke-width="3" stroke-linecap="round" transform="rotate(-90, 100, 100)"/>
                <circle cx="100" cy="100" r="8" fill="#222"/>
                <circle cx="100" cy="100" r="4" fill="#666"/>
            </g>
        </svg>
        
        <div class="speed-display">
            <span id="current-speed" class="speed-value">0</span>
            <span class="speed-unit">MPH</span>
        </div>
    </div>
    
    <div class="metrics-grid">
        <div class="metric-card">
            <span class="metric-label">MAX</span>
            <span id="max-speed" class="metric-value">0 MPH</span>
        </div>
        <div class="metric-card">
            <span class="metric-label">DIR</span>
            <span id="direction" class="metric-value">--</span>
        </div>
        <div class="metric-card full-width">
            <span class="metric-label">DISTANCE</span>
            <span id="distance" class="metric-value">0.00 mi</span>
        </div>
    </div>
    
    <div id="status-message" class="status-message">Requesting GPS access...</div>
</div>
{% endblock %}
{% block script %}
<script src="{{ url_for('static', filename = 'js/speed.js') }}"></script>
{% endblock %}
